<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0===⁅‖⁚⁚⁚⁚RADIO DUNGEON⁚⁚⁚⁚⁚⁚≫</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>0<span class="blade">===⁅‖</span>⁚⁚⁚⁚RADIO DUNGEON⁚⁚⁚⁚⁚⁚<span class="blade">≫</span></h1>
  </header>

  <main>
    <div id="post-context" hidden>
      <a id="post-context-link" target="_blank" rel="noopener" title="Открыть пост в Telegram">↗</a>
      <div id="post-context-text"></div>
    </div>

    <div class="player">
      <div id="artwork" class="empty" aria-hidden="true"></div>
      <div class="now-playing">
        <div id="now-title">Ничего не выбрано</div>
        <div id="now-artist"></div>
        <audio id="audio"></audio>
        <div class="transport">
          <button id="play-btn" type="button" title="Играть" aria-label="Играть">▶</button>
          <span id="time-current" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1"
                 aria-label="Перемотка" />
          <span id="time-total" class="time">0:00</span>
          <button id="mute-btn" type="button" title="Выключить звук" aria-label="Выключить звук">🔊</button>
          <button id="repeat-btn" type="button" title="Повтор: выкл">🔁</button>
        </div>
      </div>

      <!-- Icon: "evil moon" by Lorc, game-icons.net, CC BY 3.0 -->
      <button id="radio-btn" type="button" title="Играть как боги Хаоса решат">
        <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <path d="M255.938 19.938C124.514 19.938 17.78 126.67 17.78 258.094c0 131.422 106.735 238.156 238.157 238.156 131.423 0 238.157-106.734 238.157-238.156 0-131.422-106.734-238.156-238.156-238.156zm0 18.687c121.322 0 219.468 98.147 219.468 219.47 0 26.08-4.548 51.085-12.875 74.28-20.99 8.188-43.686 12.75-67.624 12.75-22.242 0-43.584-3.855-63.406-10.938l12.094 44.594-71.75-12.467 18.844 51.562c-57.855 7.1-108.19-15.432-130.47-49.28l81.313 1.78-23.56-48.438 72.436-8.062.688.063c-16.83-11.135-31.777-24.876-44.22-40.688 30.674-18.014 66.44-28.814 102.782-22.844-43.234-49.45-95.713-64.09-139.437-57.437a187.763 187.763 0 0 1-3.345-35.314c0-45.286 16.2-86.562 42.938-118.937 2.04-.057 4.072-.095 6.125-.095zM139.188 180.78c.638-.006 1.268-.013 1.906 0 19.467.437 38.24 10.748 48.687 28.845 15.923 27.577 6.48 62.83-21.093 78.75-27.572 15.92-62.828 6.483-78.75-21.094-15.92-27.576-6.478-62.86 21.094-78.78a57.431 57.431 0 0 1 28.157-7.72zm-.063 21.064c-20.26 0-36.906 16.643-36.906 36.906 0 20.263 16.644 36.875 36.905 36.875 20.26 0 36.875-16.612 36.875-36.875s-16.614-36.906-36.875-36.906zm0 18.687c10.16 0 18.188 8.058 18.188 18.22 0 10.162-8.028 18.188-18.188 18.188-10.16 0-18.22-8.026-18.22-18.188 0-10.162 8.06-18.22 18.22-18.22z" />
        </svg>
        <span>Chaos Moon Disco</span>
      </button>

      <div class="skip">
        <button id="prev-btn" type="button" title="Пред. трек">⏮</button>
        <button id="next-btn" type="button" title="След. трек">⏭</button>
      </div>
    </div>

    <div id="toolbar">
      <button id="sort-btn" class="icon-btn" type="button" title="Сначала новые">↓</button>

      <div class="filter-group" role="group" aria-label="Фильтр">
        <button class="icon-btn" data-filter="all" type="button" title="Все посты">☰</button>
        <button class="icon-btn" data-filter="liked" type="button" title="Только мои лайки">👍</button>
        <button class="icon-btn" data-filter="categories" type="button" title="По категориям">#</button>
      </div>

      <div id="category-filter" class="chip-row" hidden></div>
    </div>

    <div id="category-manager">
      <button id="category-manager-toggle" type="button" class="cat-manager-toggle">Категории ▾</button>
      <div id="category-manager-body" hidden>
        <div id="category-manage-list" class="chip-row"></div>
        <form id="category-create-form">
          <input id="category-name-input" type="text" placeholder="Новая категория" maxlength="40" />
          <button type="submit">+ добавить</button>
        </form>
      </div>
    </div>

    <div id="list-info"></div>

    <div id="post-list"></div>

    <div id="feed-sentinel" aria-hidden="true"></div>
    <div id="feed-end" hidden>Это всё</div>
  </main>

  <script src="app.js"></script>
  <footer class="credits">
    Иконки — <a href="https://game-icons.net/" target="_blank" rel="noopener">game-icons.net</a>:
    Lorc, Delapouite, Skoll,
    <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
  </footer>
</body>
</html>
