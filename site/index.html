<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0===⁅‖⁚⁚⁚⁚RADIO DUNGEON⁚⁚⁚⁚⁚⁚≫</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>0===⁅‖⁚⁚⁚⁚RADIO DUNGEON⁚⁚⁚⁚⁚⁚≫</h1>
    <span id="data-note"></span>
  </header>

  <main>
    <div class="player">
      <img id="artwork" alt="" />
      <div class="now-playing">
        <div id="now-title">Ничего не выбрано</div>
        <div id="now-artist"></div>
        <audio id="audio" controls></audio>
        <div class="controls">
          <button id="prev-post-btn" title="Пред. пост">⏮⏮</button>
          <button id="prev-btn" title="Пред. трек">⏮</button>
          <button id="next-btn" title="След. трек">⏭</button>
          <button id="next-post-btn" title="След. пост">⏭⏭</button>
          <button id="repeat-btn" title="Повтор: выкл">🔁</button>
        </div>
      </div>

      <!-- Icon: "falling blob" by Lorc, game-icons.net, CC BY 3.0 -->
      <button id="radio-btn" type="button" title="Играть как боги Хаоса решат">
        <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
          <path d="m227.54 25.87 128.997 177.28-219.59-169.19L259.07 198.92 20.78 26.128h-.005l180.06 232.19L35.878 129.186l169.19 225.433L20.17 219.052l210.703 228.224c59.994 56.81 154.88 55.822 213.664-2.963 58.782-58.783 59.77-153.668 2.962-213.664L227.54 25.87zm128.448 222.855c27.394 0 54.786 10.45 75.686 31.35 41.8 41.8 41.8 109.574 0 151.374s-109.573 41.8-151.373 0c-41.8-41.802-41.8-109.575 0-151.376 20.9-20.9 48.295-31.35 75.688-31.35zm-6.734 20.734c-17.067.057-36.98 7.253-52.576 20.872-13.134 11.468-20.463 25.015-22.217 36.897-1.753 11.88 1.438 21.776 10.216 29.11 17.555 14.667 55.232 11.185 81.5-11.752 13.134-11.47 20.462-25.015 22.217-36.897 1.754-11.88-1.438-21.776-10.215-29.11-7.132-5.96-17.247-9.16-28.924-9.12zm47.572 124.368c-8.597.03-19.063 3.706-27.14 10.65-6.803 5.848-10.36 12.6-11.172 18.01-.812 5.41.45 9.185 4.314 12.364 7.73 6.357 27.337 5.207 40.942-6.49 6.802-5.846 10.36-12.597 11.17-18.008.813-5.412-.45-9.187-4.313-12.366-3.14-2.582-7.918-4.18-13.8-4.16z" />
        </svg>
        <span>Chaos Radio</span>
      </button>
    </div>

    <div id="toolbar">
      <label class="field">
        Сортировка
        <select id="sort-select">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
        </select>
      </label>

      <label class="field">
        Фильтр
        <select id="filter-select">
          <option value="all">Все посты</option>
          <option value="liked">Мои лайки</option>
          <option value="categories">По категориям</option>
        </select>
      </label>

      <div id="category-filter" class="chip-row" hidden></div>
    </div>

    <div id="category-manager">
      <button id="category-manager-toggle" type="button" class="cat-manager-toggle">Категории ▾</button>
      <div id="category-manager-body" hidden>
        <div id="category-manage-list" class="chip-row"></div>
        <form id="category-create-form">
          <input id="category-name-input" type="text" placeholder="Новая категория" maxlength="40" />
          <button type="submit">+ добавить</button>
        </form>
      </div>
    </div>

    <div id="pagination" class="pagination">
      <button id="page-prev">← Пред.</button>
      <span id="page-info"></span>
      <button id="page-next">След. →</button>
    </div>

    <div id="post-list"></div>

    <div id="pagination-bottom" class="pagination">
      <button id="page-prev-bottom">← Пред.</button>
      <span id="page-info-bottom"></span>
      <button id="page-next-bottom">След. →</button>
    </div>
  </main>

  <script src="app.js"></script>
  <footer class="credits">
    Иконка <a href="https://game-icons.net/1x1/lorc/falling-blob.html" target="_blank" rel="noopener">falling blob</a>
    — Lorc, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
  </footer>
</body>
</html>
