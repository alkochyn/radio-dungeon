<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>og card</title>
<!--
  The picture a chat shows when someone drops a link to the player. It is a page, not a
  screenshot: the card that shipped before was a grab of the player window scaled by the
  machine's own pixel ratio, which is how it ended up 1200x631 with two fifths of it
  empty. Here the frame is stated once, at the size the meta tags promise.

  Render it (chrome or msedge, either will do):

    chrome --headless --disable-gpu --hide-scrollbars \
           --force-device-scale-factor=1 --window-size=1200,630 \
           --screenshot=site/og.png tools/og-card.html

  --force-device-scale-factor=1 is the part that matters: without it the shot comes out
  at whatever ratio the display runs at. Re-run it whenever the player's look moves on,
  and keep og:image:width / og:image:height in site/index.html in step with the size
  above - a chat lays out the preview box from those numbers before the file arrives.

  The player here is built out of style.css rather than screenshotted, so it re-renders
  at any size and keeps the real controls' look: same plate colour, same bevel on the
  transport pill, same game-icons artwork, same burning seek bar. Three things the page
  has are deliberately not on the card - the disco button, the strapline and the rack of
  weapons: a preview is read in a second at thumbnail size, and every extra object in it
  costs the two that matter their room.

  og-avatar.jpg is the channel's own picture, taken from its public page. The drawing is
  a circle inked inside a black square, so it is clipped to a circle here - the corners
  are the paper it was scanned on, not part of it.
-->
<style>
  /* The page's own colours, copied rather than imported: style.css is written for a
     live player - hover states, animations, a hue js rolls on load - and none of that
     survives a single frame anyway. The hue here is the one the site starts on. */
  :root { --h: 18; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #14141a;
    color: #eee;
    font-family: system-ui, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }

  /* Torchlight from above and coals along the floor - the two lights the player sits
     between on the real page, flattened into one still. */
  .torch,
  .coals {
    position: absolute;
    pointer-events: none;
  }
  .torch {
    inset: -200px -120px auto -220px;
    height: 620px;
    background: radial-gradient(
      50% 60% at 38% 40%,
      hsl(var(--h) 90% 55% / 0.16) 0%,
      hsl(var(--h) 85% 45% / 0.05) 45%,
      transparent 72%
    );
  }
  .coals {
    inset: auto -60px -230px -60px;
    height: 430px;
    background: radial-gradient(
      60% 100% at 50% 100%,
      hsl(var(--h) 95% 50% / 0.2) 0%,
      hsl(var(--h) 90% 45% / 0.06) 40%,
      transparent 70%
    );
  }

  /* --- the signage ------------------------------------------------------------- */
  h1 {
    /* The torch and the coals are positioned, so anything meant to read through them
       has to be positioned too - in flow it paints underneath. */
    position: relative;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.05;
    white-space: nowrap;
    color: #f4f4fa;
    text-shadow: 0 0 24px hsl(var(--h) 90% 55% / 0.25);
  }
  /* The blade hangs below the lettering exactly as it does in the header - see .blade
     in style.css. */
  .blade {
    position: relative;
    top: -0.09em;
    color: #cfd2e4;
  }
  .rule {
    position: relative;
    height: 2px;
    margin: 18px 0 28px;
    background: linear-gradient(90deg, hsl(var(--h) 95% 55%), hsl(var(--h) 85% 30% / 0));
  }

  /* --- the player ------------------------------------------------------------- */
  .player {
    position: relative;
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 30px;
    background: #1e1e26;
    border-radius: 2px;
  }
  /* The channel's drawing is round - a circle inked inside a black square, and the
     square's corners are just the paper. */
  .cover {
    flex: none;
    width: 232px;
    height: 232px;
    border-radius: 50%;
    background: url("og-avatar.jpg") center / cover no-repeat;
    box-shadow:
      0 0 0 2px hsl(var(--h) 60% 40% / 0.55),
      0 0 34px hsl(var(--h) 90% 50% / 0.3);
  }

  .now { flex: 1 1 auto; min-width: 0; }
  .now-title {
    font-size: 34px;
    font-weight: 600;
    color: #f0f0f6;
    line-height: 1.2;
  }
  .now-title b { color: #fff; }

  /* The transport pill, bevelled the way the real one is: clip-path cuts the corners,
     which is why nothing here carries a border. */
  .transport,
  .transport button {
    border: none;
    clip-path: polygon(
      var(--cut) 0,
      calc(100% - var(--cut)) 0,
      100% var(--cut),
      100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,
      var(--cut) 100%,
      0 calc(100% - var(--cut)),
      0 var(--cut)
    );
  }
  .transport {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 30px;
    padding: 14px 22px 14px 14px;
    background: #15151c;
    --cut: 11px;
    border-radius: 2px;
  }
  .transport button {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    padding: 0;
    --cut: 8px;
    border-radius: 2px;
    background: #2a2a35;
  }
  .transport button svg { width: 52%; height: 52%; fill: #eee; }
  /* Play is the one control that carries the evening's colour. */
  .transport .play {
    width: 66px;
    height: 66px;
    --cut: 10px;
    background: linear-gradient(180deg, hsl(var(--h) 26% 27%) 0%, hsl(var(--h) 28% 16%) 100%);
  }
  .transport .play svg { fill: hsl(var(--h) 95% 72%); }

  /* The played part burns, the rest is cold - the same language as the disco button. */
  .seek {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 4px;
    border-radius: 2px;
    background: #33333f;
  }
  .seek::before {
    content: "";
    position: absolute;
    inset: 0 62% 0 0;
    border-radius: 2px;
    background: #d4551a;
  }
  .seek::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 38%;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 50%;
    background: #ffb070;
    box-shadow: 0 0 8px rgba(255, 150, 60, 0.75);
  }
  .vol { font-size: 22px; }
  /* On the real page the heart is a css mask - one file for a thousand rows. Here it
     is drawn inline: a mask is a stylesheet url, and a stylesheet url does not resolve
     over file://, so the mask silently rendered nothing. It is shown liked, because a
     full heart says what the button is for in a picture nobody can click.
     Icon: "heart organ" by Lorc, game-icons.net, CC BY 3.0 */
  .heart {
    flex: none;
    width: 34px;
    height: 34px;
    fill: #c2402f;
  }

</style>
</head>
<body>

  <div class="coals"></div>
