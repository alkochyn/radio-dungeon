# Rebuild and publish the web player.
#
# Bandcamp hands out stream urls that stop working after 24 hours, and the static site
# has no backend to refresh them on demand - so the whole catalogue is re-baked here on
# a schedule and republished. Every 6 hours leaves a 4x margin against that expiry.
#
# Nothing secret is involved: the channel is read through its public web preview and
# bandcamp pages are read anonymously.

name: build-site

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "backend/app/bandcamp.py"
      - ".github/workflows/build-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet httpx beautifulsoup4 python-dotenv

      # Guards the install list above: the build reads bandcamp's own json and must not
      # drag yt-dlp in through an import chain.
      - name: Check the build imports without yt-dlp
        run: python backend/tests/test_web_build_imports.py

      - name: Check the bandcamp parser
        run: python backend/tests/test_bandcamp.py

      # The catalogue (which posts exist, which tracks are in them) is committed, so a
      # run only has to fetch what the channel added since last time.
      - name: Sync new posts from the channel
        env:
          TG_MODE: anonymous
          TG_DATA_DIR: ${{ github.workspace }}/catalog
        run: python tools/sync_catalog.py

      # Links live 24h and this job runs every 6, so most runs can reuse what the
      # previous one baked and touch bandcamp for nothing at all. That only works if
      # the previous posts.json survives between runs - it is too big to commit four
      # times a day, so it lives in the actions cache instead. A cache miss just means
      # a full rebake, which is correct, only slower.
      - name: Restore previously baked links
        uses: actions/cache@v4
        with:
          path: site/data/posts.json
          key: baked-links-${{ github.run_id }}
          restore-keys: baked-links-

      - name: Bake stream urls
        run: python tools/build_site_data.py --tracks catalog/tracks.json

      # posts.json is rewritten every run and would bloat history fast, so it ships to
      # Pages as an artifact instead. Only the catalogue and the album cache are kept.
      - name: Commit catalogue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --staged --quiet; then
            echo "каталог не изменился"
            exit 0
          fi
          git commit -m "Update channel catalogue"
          # Syncing and baking take long enough that a push to main can land while this
          # job runs, and then the catalogue commit is rejected as behind. It never
          # touches anything but catalog/, so replaying it on top of whatever arrived
          # is always the right answer.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push отклонён, подтягиваю main (попытка $attempt)"
            git pull --rebase origin main
          done
          echo "каталог не удалось запушить за 3 попытки"
          exit 1

      # Pages serves every file with max-age=600 and browsers expire them independently,
      # so a visitor can hold an old index.html next to a fresh app.js. Stamping the
      # asset urls with a content hash keeps the pair together.
      - name: Pin index.html to its assets
        run: python tools/stamp_assets.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
